<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Syntaxor logo">
  <defs>
    <linearGradient id="brandTileBase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dce6f2" />
      <stop offset="100%" stop-color="#8ea3ba" />
    </linearGradient>
    <radialGradient id="brandTileGlow" cx="35%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="brandTileShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="rgba(0, 0, 0, 0.35)" />
    </filter>
  </defs>
  <rect x="1" y="1" width="62" height="62" rx="8" fill="url(#brandTileBase)" filter="url(#brandTileShadow)" />
  <rect x="1" y="1" width="62" height="62" rx="8" fill="url(#brandTileGlow)" />
  <g transform="translate(-2 0)">
    <circle cx="14" cy="22" r="6.4" fill="#0066ff" />
    <circle cx="14" cy="42" r="6.4" fill="#0066ff" />
    <circle cx="28" cy="22" r="6.4" fill="#0066ff" />
    <circle cx="28" cy="42" r="6.4" fill="#0066ff" />
    <line x1="42" y1="27" x2="58" y2="27" stroke="#ff0000" stroke-width="8" stroke-linecap="round" />
    <line x1="42" y1="37" x2="58" y2="37" stroke="#0066ff" stroke-width="8" stroke-linecap="round" />
  </g>
</svg>
